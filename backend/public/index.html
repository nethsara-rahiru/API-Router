<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Router — AI API Management & Key Gateway</title>
    <meta name="description" content="Intelligent AI API Router and Key Management Platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>
<div id="app">

    <!-- ===== AUTH VIEW ===== -->
    <div id="auth-view" class="view">
        <div class="auth-bg-blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>
        <div class="auth-container glass">
            <div class="brand-logo">
                <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                    <rect width="36" height="36" rx="10" fill="url(#grad)"/>
                    <path d="M10 18L16 12L22 18L28 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 24L16 18L22 24L28 18" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                    <defs><linearGradient id="grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
                </svg>
                <h1 class="gradient-text">API Router</h1>
            </div>
            <p class="auth-subtitle">AI Gateway & Key Management Platform</p>

            <!-- Login Form -->
            <div id="login-panel">
                <form id="login-form" novalidate>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div id="login-error" class="form-error" style="display:none;"></div>
                    <button type="submit" id="login-btn" class="btn btn-primary btn-full">Sign In</button>
                </form>
                <p class="auth-switch">No account? <a href="#" id="show-register">Create one →</a></p>
            </div>

            <!-- Register Form -->
            <div id="register-panel" style="display:none;">
                <form id="register-form" novalidate>
                    <div class="input-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" placeholder="Jane Doe" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="you@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Min. 8 characters" required>
                    </div>
                    <div id="register-error" class="form-error" style="display:none;"></div>
                    <button type="submit" id="register-btn" class="btn btn-primary btn-full">Create Account</button>
                </form>
                <p class="auth-switch">Already have an account? <a href="#" id="show-login">Sign in →</a></p>
            </div>
        </div>
    </div>

    <!-- ===== DASHBOARD LAYOUT ===== -->
    <div id="dashboard-layout" class="view" style="display:none;">
        <nav class="sidebar glass">
            <div class="sidebar-brand">
                <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
                    <rect width="36" height="36" rx="10" fill="url(#grad2)"/>
                    <path d="M10 18L16 12L22 18L28 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10 24L16 18L22 24L28 18" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
                    <defs><linearGradient id="grad2" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
                </svg>
                <span class="gradient-text">API Router</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" data-route="dashboard" class="nav-link active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    Dashboard
                </a></li>
                <li><a href="#" data-route="api-keys" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                    API Keys
                </a></li>
                <li><a href="#" data-route="providers" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                    Provider Keys
                </a></li>
                <li><a href="#" data-route="analytics" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    Analytics
                </a></li>
                <li><a href="#" data-route="routing" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
                    Routing
                </a></li>
                <li><a href="#" data-route="docs" class="nav-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Docs
                </a></li>
            </ul>
            <div class="sidebar-user">
                <div class="user-avatar" id="user-avatar-text">U</div>
                <div class="user-info">
                    <span id="sidebar-username">User</span>
                    <span class="user-role" id="sidebar-role">developer</span>
                </div>
                <button id="logout-btn" class="btn-icon" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </nav>

        <main class="main-content">
            <div id="content-area"></div>
        </main>
    </div>

</div><!-- /#app -->

<!-- ===== MODAL ===== -->
<div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal glass" id="modal-box">
        <div class="modal-header">
            <h3 id="modal-title">Modal</h3>
            <button class="btn-icon" id="modal-close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div id="modal-body"></div>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast-container"></div>

<!-- Load View Scripts FIRST, then App Script LAST -->
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/api-keys.js"></script>
<script src="/js/providers.js"></script>
<script src="/js/analytics.js"></script>
<script src="/js/routing.js"></script>
<script src="/js/docs.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
